name: Maintenance workflow tests

on:
  push:
    branches: [main]
    paths:
      - 'tools/maintenance/**'
      - '.github/workflows/maintenance.yml'
  pull_request:
    paths:
      - 'tools/maintenance/**'
      - '.github/workflows/maintenance.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/maintenance -p "test_*.py"
